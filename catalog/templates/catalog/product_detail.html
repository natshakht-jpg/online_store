{% extends 'catalog/base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <h1>{{ product.name }}</h1>
        <p><strong>Цена:</strong> {{ product.price }} $</p>
        <p><strong>Описание:</strong> {{ product.description }}</p>
        <a href="/" class="btn btn-secondary">Назад</a>
    </div>
</div>
{% endblock %}
