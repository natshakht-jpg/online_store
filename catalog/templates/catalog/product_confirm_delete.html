{% extends 'catalog/base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<h2>Удалить товар "{{ product.name }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
