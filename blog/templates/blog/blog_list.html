{% extends 'catalog/base.html' %}

{% block title %}Блог{% endblock %}

{% block content %}
<h1>Статьи блога</h1>
<a href="{% url 'blog:blog_create' %}" class="btn btn-primary mb-3">Новая статья</a>

{% for post in posts %}
<div class="card mb-3">
    <div class="card-body">
        <h2 class="card-title">{{ post.title }}</h2>
        <p class="card-text">{{ post.content|truncatechars:200 }}</p>
        <a href="{% url 'blog:blog_detail' post.pk %}" class="btn btn-primary">Читать</a>
        <a href="{% url 'blog:blog_edit' post.pk %}" class="btn btn-secondary">Редактировать</a>
        <a href="{% url 'blog:blog_delete' post.pk %}" class="btn btn-danger">Удалить</a>
    </div>
</div>
{% empty %}
<p>Нет статей.</p>
{% endfor %}
{% endblock %}
