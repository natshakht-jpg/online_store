{% extends 'catalog/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>
<p><strong>Просмотров:</strong> {{ post.views_count }}</p>

{% if post.preview %}
    <img src="{{ post.preview.url }}" class="img-fluid" alt="{{ post.title }}">
{% endif %}

<p>{{ post.content }}</p>
<a href="{% url 'blog:blog_list' %}" class="btn btn-primary">К списку</a>
<a href="{% url 'blog:blog_edit' post.pk %}" class="btn btn-secondary">Редактировать</a>
<a href="{% url 'blog:blog_delete' post.pk %}" class="btn btn-danger">Удалить</a>
{% endblock %}
